# bfx-app-secrets vindo do AWS SSM, no mesmo padrao dos outros apps do cluster
# (1 parametro SecureString com JSON de todas as chaves + dataFrom.extract).
#
# SSM: /softlive/bfx/prod/secrets/bfx-app-secrets   (sa-east-1, SecureString)
#
# Pra alterar um valor: edite o parametro no SSM. O ESO re-le a cada 1h e o
# Reloader (annotation no app.yaml) reinicia o Deployment — envFrom so e lido na
# criacao do container, entao sem o Reloader a mudanca nao chegaria no pod.
# Pra aplicar na hora, sem esperar a 1h:
#   kubectl annotate externalsecret bfx-app-secrets -n bfx force-sync=$(date +%s) --overwrite
#
# deletionPolicy: Retain — se este ExternalSecret for removido, o Secret fica de
# pe em vez de sumir junto. NAO protege contra prune do ArgoCD (creationPolicy
# Owner poe ownerReference e o GC cascateia), entao nao remover este arquivo do
# git sem antes conferir que o Secret sobreviveu.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bfx-app-secrets
  namespace: bfx
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: bfx-app-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: /softlive/bfx/prod/secrets/bfx-app-secrets
