# CronJobs da aplicacao BFX — chamam os endpoints /api/cron/* autenticados por CRON_SECRET.
# Clonam o template de cronjob-cleanup-uploads.yaml (curlimages/curl + Bearer + APP_URL interno).
# Horarios em UTC (BRT = UTC-3). Producao roda em K8s/ArgoCD — estes substituem os crons do vercel.json.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bfx-aniversario
  labels:
    app: bfx-aniversario
spec:
  schedule: "0 9 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: bfx-aniversario
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl-cron
              image: curlimages/curl:latest
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  response=$(curl -sf -w "\n%{http_code}" \
                    -H "Authorization: Bearer $CRON_SECRET" \
                    "$APP_URL/api/cron/aniversario")
                  http_code=$(echo "$response" | tail -n1)
                  body=$(echo "$response" | sed '$d')
                  echo "HTTP $http_code - $body"
                  [ "$http_code" = "200" ] || exit 1
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: bfx-app-secrets
                      key: CRON_SECRET
                - name: APP_URL
                  value: "http://bfx-app"
