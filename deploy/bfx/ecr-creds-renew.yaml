apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-creds-renew
  namespace: bfx
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-creds-renew
  namespace: bfx
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-creds-renew
  namespace: bfx
subjects:
- kind: ServiceAccount
  name: ecr-creds-renew
  namespace: bfx
roleRef:
  kind: Role
  name: ecr-creds-renew
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-creds-renew
  namespace: bfx
spec:
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: ecr-creds-renew
          restartPolicy: OnFailure
          containers:
          - name: renew
            image: amazon/aws-cli:2.27.31
            envFrom:
            - secretRef:
                name: bfx-ecr-aws-creds
            command:
            - /bin/sh
            - -c
            - |
              TOKEN=$(aws ecr get-login-password --region sa-east-1)
              # Install kubectl
              curl -sLO "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl" && chmod +x kubectl
              # Delete old secret and create new one
              ./kubectl delete secret ecr-creds -n bfx --ignore-not-found
              ./kubectl create secret docker-registry ecr-creds \
                --namespace=bfx \
                --docker-server=730335375436.dkr.ecr.sa-east-1.amazonaws.com \
                --docker-username=AWS \
                --docker-password="$TOKEN"
              echo "ECR creds renewed at $(date)"
