# ATENCAO: nao voltar a commitar valor de secret aqui.
#
# O `bfx-app-secrets` saiu deste arquivo e agora vem do AWS SSM via
# ExternalSecret (ver externalsecret-app.yaml). Estava tudo em texto puro no
# git — inclusive a chave de PRODUCAO do Asaas e um CRON_SECRET que nunca saiu
# do placeholder `change-me-...`, o que deixava as 11 rotas de /api/cron/*
# acionaveis por qualquer um com acesso ao repositorio.
#
# O `bfx-secrets` foi removido: nao era referenciado por nenhum manifest
# (conferido em todo deploy/bfx) e so tinha valor placeholder.
#
# PENDENTE: o bfx-db-secrets abaixo ainda esta com valor no git. Move-lo pro SSM
# sozinho agrega pouco enquanto a senha for `postgres` — o certo e rotacionar e
# migrar na mesma operacao (ALTER USER no banco + atualizar DATABASE_URL no SSM +
# restart do app e do postgres), que e coordenacao demais pra entrar aqui.
apiVersion: v1
kind: Secret
metadata:
  name: bfx-db-secrets
  namespace: bfx
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: bfx
