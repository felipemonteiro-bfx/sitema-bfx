# Os objetos publicos do bucket sao servidos PELO APP, nao por um backend de
# storage no Ingress.
#
# Ate 2026-08-12 havia aqui um path `/produtos` -> `bfx-minio:9000`. Ele existia
# porque `uploadToMinIO` devolve `${MINIO_PUBLIC_URL}/${MINIO_BUCKET}/${key}` =
# `https://bfx.softlive.dev/produtos/<key>`, e o MinIO path-style entregava o
# objeto sem reescrita nenhuma.
#
# POR QUE SAIU
#
# O `bfx-minio` esta em replicas=0 desde a consolidacao dos Garages e o app
# passou a gravar em `garage.hiper:3900`. A regra ficou apontando para um
# Service sem endpoint: 503 em toda imagem de produto. Nao doia ainda so porque
# o bucket estava com zero objeto — o primeiro upload e que quebraria.
#
# POR QUE NAO BASTAVA REPONTAR PARA O GARAGE
#
# Exigiria leitura anonima no bucket, e `produtos` nao guarda so imagem: tem
# tambem `recibos/assinado-<venda>-<ts>.pdf` e
# `relatorios/mensal/<periodo>/<empresa>`, de chave adivinhavel. Abrir o bucket
# publicaria recibo assinado e relatorio de vendas junto com as fotos.
#
# Sem este path, `/produtos/<key>` cai no catch-all `/` e quem responde e o
# route handler `src/app/produtos/[...chave]/route.ts`, que le do Garage com a
# credencial do app (`app-bfx`, RWO so em `produtos`) e libera por allowlist —
# imagem na raiz e `logo/`, o resto 404. A restricao antiga ("nao criar pagina
# Next em /produtos") caiu junto: agora e exatamente o app que deve atender ali.
#
# O console de administracao do MinIO (porta 9001) segue de fora de proposito
# — ver T-05-06 no threat model do plano 05-02.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bfx-ingress
  namespace: bfx
  annotations:
    argocd.argoproj.io/sync-options: SkipHealthCheck=true
spec:
  ingressClassName: traefik
  rules:
    - host: bfx.softlive.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bfx-app
                port:
                  number: 80
