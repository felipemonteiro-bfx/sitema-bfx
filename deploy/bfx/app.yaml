apiVersion: apps/v1
kind: Deployment
metadata:
  name: bfx-app
  labels:
    app: bfx-app
  annotations:
    # bfx-app-secrets agora vem do SSM via ExternalSecret e muda fora do git.
    # envFrom so e lido na criacao do container, entao sem isto uma troca de
    # secret (ex: rotacionar CRON_SECRET) nao chegaria no pod ate alguem
    # reiniciar na mao.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: bfx-app
  template:
    metadata:
      labels:
        app: bfx-app
    spec:
      imagePullSecrets:
        - name: ecr-creds
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: bfx-db-secrets
          command:
            - sh
            - -c
            - |
              until pg_isready -h bfx-db -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                echo "waiting for database..."
                sleep 2
              done
      containers:
        - name: app
          image: 730335375436.dkr.ecr.sa-east-1.amazonaws.com/bfx/bfx-shop:938b273a5a683c4828cbfb088c9f69d44e8e842d
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
          envFrom:
            - secretRef:
                name: bfx-app-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: bfx-app
  labels:
    app: bfx-app
spec:
  type: ClusterIP
  selector:
    app: bfx-app
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
# Nome estavel para o servidor MCP do agente de WhatsApp
# (docs/MCP-AGENTE-SPEC.md). Aponta para os mesmos pods do bfx-app porque e la
# que moram o Prisma client e a credencial do bfx-db — um Deployment separado
# duplicaria os dois sem isolar nada (mesmo banco, mesmo segredo).
#
# O Service existe mesmo assim para que a plataforma de WhatsApp aponte para
# `mcp-bfx` e nao para `bfx-app`: no dia em que o servidor MCP virar pod
# proprio, muda o selector aqui e nada muda do outro lado.
#
# URL para o gateway: http://mcp-bfx.bfx.svc.cluster.local/api/mcp/agente
apiVersion: v1
kind: Service
metadata:
  name: mcp-bfx
  labels:
    app: bfx-app
    component: mcp-agente
spec:
  type: ClusterIP
  selector:
    app: bfx-app
  ports:
    - name: http
      port: 80
      targetPort: 3000
