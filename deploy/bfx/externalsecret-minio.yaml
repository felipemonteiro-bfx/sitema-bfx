# bfx-minio-secrets vindo do AWS SSM, no mesmo padrao de externalsecret-app.yaml
# (commit e94fe79, D-04): 1 parametro SecureString com JSON de todas as chaves
# + dataFrom.extract.
#
# SSM: /softlive/bfx/prod/secrets/bfx-minio-secrets   (sa-east-1, SecureString)
# Formato do JSON (sem valores aqui — so as chaves):
#   { "MINIO_ROOT_USER": "...", "MINIO_ROOT_PASSWORD": "..." }
#
# Pra alterar um valor: edite o parametro no SSM. O ESO re-le a cada 1h e o
# Reloader (annotation em minio.yaml) reinicia o Deployment — envFrom so e
# lido na criacao do container, entao sem o Reloader a mudanca nao chegaria
# no pod. Pra aplicar na hora, sem esperar a 1h:
#   kubectl annotate externalsecret bfx-minio-secrets -n bfx force-sync=$(date +%s) --overwrite
#
# deletionPolicy: Retain — se este ExternalSecret for removido, o Secret fica
# de pe em vez de sumir junto. NAO protege contra prune do ArgoCD
# (creationPolicy Owner poe ownerReference e o GC cascateia), entao nao
# remover este arquivo do git sem antes conferir que o Secret sobreviveu.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bfx-minio-secrets
  namespace: bfx
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: bfx-minio-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: /softlive/bfx/prod/secrets/bfx-minio-secrets
