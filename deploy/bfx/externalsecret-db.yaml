# bfx-db-secrets vindo do AWS SSM (2026-09-11), no mesmo padrao de
# externalsecret-app.yaml. Antes ficava em secrets.yaml, em texto puro no git,
# com a senha `postgres`.
#
# SSM: /softlive/bfx/prod/secrets/bfx-db-secrets   (sa-east-1, SecureString, JSON)
# Chaves: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, EVOLUTION_DATABASE_URI
#
# POSTGRES_PASSWORD so vale quando o volume do postgres e criado. Trocar a senha
# de um banco que ja existe e uma operacao so, nesta ordem:
#   1. ALTER ROLE postgres WITH PASSWORD '...' dentro do bfx-db-0;
#   2. a mesma senha em POSTGRES_PASSWORD e EVOLUTION_DATABASE_URI (aqui) e no
#      DATABASE_URL de bfx-app-secrets;
#   3. force-sync nos dois ExternalSecrets — o Reloader reinicia o app; a
#      Evolution le a URI na criacao do container (reiniciar o Deployment).
#
# deletionPolicy: Retain — mesmo cuidado de externalsecret-app.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bfx-db-secrets
  namespace: bfx
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: bfx-db-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: /softlive/bfx/prod/secrets/bfx-db-secrets
