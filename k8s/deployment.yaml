apiVersion: apps/v1
kind: Deployment
metadata:
  name: sitema-bfx
  namespace: sitema-bfx
  labels:
    app: sitema-bfx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sitema-bfx
  template:
    metadata:
      labels:
        app: sitema-bfx
    spec:
      containers:
        - name: app
          # Substitua pela sua imagem (ex.: registry.io/sitema-bfx:latest)
          image: sitema-bfx:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: sitema-bfx-secret
            # Descomente se usar ConfigMap para variáveis não sensíveis
            # - configMapRef:
            #     name: sitema-bfx-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
