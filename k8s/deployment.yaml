apiVersion: apps/v1
kind: Deployment
metadata:
  name: sitema-bfx
  namespace: sitema-bfx
  labels:
    app: sitema-bfx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sitema-bfx
  template:
    metadata:
      labels:
        app: sitema-bfx
    spec:
      containers:
        - name: app
          # ECR (account 730335375436, repo bfx/bfx-shop)
          image: 730335375436.dkr.ecr.sa-east-1.amazonaws.com/bfx/bfx-shop:5f0b8c337b6a5169e134cf56868b520174712b5c
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: sitema-bfx-secret
            # Descomente se usar ConfigMap para variáveis não sensíveis
            # - configMapRef:
            #     name: sitema-bfx-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
