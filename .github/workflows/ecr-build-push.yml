name: Build → ECR → Deploy (Kustomize)

on:
  push:
    branches:
      - main
      - nextjs-migration
    paths-ignore:
      - deploy/**
      - k8s/**
      - .github/**

concurrency:
  group: ecr-build-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: sa-east-1
  ECR_REPOSITORY: bfx/bfx-shop
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push to ECR
        id: build
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          docker build -t "$IMAGE_URI:$IMAGE_TAG" -t "$IMAGE_URI:latest" -f Dockerfile .
          docker push "$IMAGE_URI:$IMAGE_TAG"
          docker push "$IMAGE_URI:latest"
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update kustomization.yaml and push
        env:
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_URI: ${{ steps.build.outputs.image_uri }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Pull latest first to avoid rebase conflicts on concurrent builds
          git pull --rebase origin "$BRANCH"

          # Update the image tag in kustomization.yaml
          cd deploy/bfx
          kustomize edit set image "$IMAGE_URI:$IMAGE_TAG"
          cd ../..

          # Commit only if there are changes
          git add deploy/bfx/kustomization.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "build: deploy ${IMAGE_TAG:0:7} to $BRANCH"
          git push
