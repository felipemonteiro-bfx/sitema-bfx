# CI: lint e build em todo push/PR para main e nextjs-migration
name: CI

on:
  push:
    branches: [main, nextjs-migration]
  pull_request:
    branches: [main, nextjs-migration]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/bfx?schema=public"

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/bfx?schema=public"
          SKIP_ENV_VALIDATION: "1"
