# CI: lint, test e build em todo push/PR (deploy em producao é via ECR + ArgoCD)
name: CI

on:
  push:
    branches: [main, nextjs-migration]
    paths-ignore:
      - deploy/**
      - k8s/**
      - .github/**
  pull_request:
    branches: [main, nextjs-migration]

env:
  DATABASE_URL: "postgresql://user:pass@localhost:5432/bfx?schema=public"
  BUILD_DATABASE_URL: "postgresql://user:pass@localhost:5432/bfx?schema=public"
  SESSION_SECRET: "ci-build-dummy-secret-min-32-chars-long"
  SKIP_ENV_VALIDATION: "1"

jobs:
  lint-and-build:
    # Runner hospedado do GitHub (sai do self-hosted, que travava os jobs na fila).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint
        run: npm run lint

      - name: Cor crua (catraca)
        run: npm run cores:check

      - name: Contraste de tokens
        run: npm run contraste:check

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build
