# CI: lint e build em todo push/PR (deploy é feito pela integração Git da Vercel)
name: CI

on:
  push:
    branches: [main, nextjs-migration]
    paths-ignore:
      - deploy/**
      - k8s/**
  pull_request:
    branches: [main, nextjs-migration]

env:
  BUILD_DATABASE_URL: "postgresql://user:pass@localhost:5432/bfx?schema=public"
  SESSION_SECRET: "ci-build-dummy-secret-min-32-chars-long"
  SKIP_ENV_VALIDATION: "1"

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ env.BUILD_DATABASE_URL }}

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ env.BUILD_DATABASE_URL }}
