# CI: lint, test e build em todo push/PR (deploy em producao é via ECR + ArgoCD)
name: CI

on:
  push:
    branches: [main, nextjs-migration]
    paths-ignore:
      - deploy/**
      - k8s/**
      - .github/**
  pull_request:
    branches: [main, nextjs-migration]

env:
  DATABASE_URL: "postgresql://user:pass@localhost:5432/bfx?schema=public"
  BUILD_DATABASE_URL: "postgresql://user:pass@localhost:5432/bfx?schema=public"
  SESSION_SECRET: "ci-build-dummy-secret-min-32-chars-long"
  SKIP_ENV_VALIDATION: "1"

jobs:
  lint-and-build:
    # Runner hospedado do GitHub (sai do self-hosted, que travava os jobs na fila).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      # O Dockerfile que constroi a imagem de producao instala com
      # `yarn install --frozen-lockfile` sobre o yarn.lock. Enquanto o CI usava
      # `npm ci || npm install` sobre o package-lock.json, os dois validavam
      # conjuntos DIFERENTES de dependencia — e o dependabot so atualiza o
      # yarn.lock, entao a atualizacao chegava em producao sem passar pelo CI.
      # Era exatamente o caso do PR do Prisma 7. Agora o CI instala igual a
      # producao, com o mesmo lock.
      - name: Install dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Cor crua (catraca)
        run: yarn cores:check

      - name: Contraste de tokens
        run: yarn contraste:check

      # Complementa a catraca de cor crua, que so enxerga classe Tailwind de COR.
      # Barra tamanho de fonte arbitrario (`text-[10px]`) e cor literal escrita em
      # CSS puro — foi por CSS puro que o degrade de tres cores dos titulos
      # atravessou intacto a troca da paleta da marca, invisivel para as duas
      # travas anteriores.
      - name: Escala e cor em CSS (catraca)
        run: yarn escala:check

      # Comentario JSX como primeiro token de `{cond && (` e erro de sintaxe.
      # Aconteceu 3x numa unica sessao e sempre so apareceu no Lint, DEPOIS do
      # push. Este passo roda antes e falha com a linha exata.
      - name: Sanidade JSX
        run: yarn jsx:check

      - name: Generate Prisma Client
        run: yarn prisma generate

      - name: Test
        run: yarn vitest run

      - name: Build
        run: yarn build
